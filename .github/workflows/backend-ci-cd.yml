name: Backend CI/CD Pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  # Cho phép bấm "Run workflow" để deploy tay trên tab Actions
  workflow_dispatch:

jobs:
  # ==========================================
  #  CI JOB — build & test (chạy cả khi tạo PR lẫn trước khi deploy)
  # ==========================================
  ci-build:
    name: CI – Build & Test Backend
    runs-on: ubuntu-latest
    # MySQL tạm chỉ sống trong job CI: test API chạy trên database thật (schema + seed như production)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: luxe_test
          MYSQL_USER: luxe_user
          MYSQL_PASSWORD: luxe_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build (TypeScript nếu có)
        run: npm run build --if-present

      - name: Load schema & seed into test MySQL
        run: |
          for f in database/init/*.sql; do
            mysql -h 127.0.0.1 -P 3306 -uroot -proot --default-character-set=utf8mb4 luxe_test < "$f"
          done
          mysql -h 127.0.0.1 -uroot -proot -N -e "SELECT COUNT(*) AS products FROM luxe_test.products"

      # Test lỗi => job đỏ => CD (needs: ci-build) không chạy => không deploy code lỗi
      - name: Run API Tests
        run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: luxe_user
          DB_PASSWORD: luxe_pass
          DB_NAME: luxe_test
          JWT_SECRET: ci-test-secret

      - name: Test Docker Build
        run: docker build -t luxe-backend-test .

  # ==========================================
  #  CD JOB — deploy lên EC2 khi merge/push vào main
  # ==========================================
  cd-deploy:
    name: CD – Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: ci-build
    # ci-build chạy mọi event, cd-deploy chỉ chạy khi push main.
    # Chưa khai báo biến AWS_ROLE_ARN (Settings → Variables) thì bỏ qua deploy thay vì báo lỗi.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    # id-token: write để đăng nhập AWS bằng OIDC (không lưu access key trong GitHub)
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-southeast-1
      SG_ID: ${{ vars.AWS_SG_ID }}

    steps:
      # Cổng 22 của EC2 bình thường chỉ mở cho IP quản trị. Chỉ mở cho IP runner này trong lúc deploy.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Open SSH for this runner
        run: |
          IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "RUNNER_IP=$IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$IP/32,Description=github-actions-deploy}]" \
            || echo "Rule đã tồn tại"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/luxe2/luxe_backend
            git pull --ff-only origin main
            docker compose build backend
            docker compose up -d mysql backend
            docker image prune -f
            docker compose ps

      - name: Close SSH for this runner
        if: always() && env.RUNNER_IP != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP/32}]"
